; UE 기본값은 스탠드얼론(-game) 기동 시 뷰포트가 마우스를 '영구 캡처' 한다.
; 캡처가 걸리면 Slate 는 히트테스트를 건너뛰고 캡처 위젯(SViewport)에만 이벤트를 보내므로
; **UI 버튼이 클릭을 영영 못 받고, 커서가 화면 중앙으로 끌려간다** (2026-07-17 실측: captor=1, 커서 960,636 고정).
; 창 활성화 타이밍에 따라 캡처가 걸리기도/안 걸리기도 해서 증상이 간헐적으로 보였다.
;
; 본 게임은 마우스로 UI 를 조작하는 보드/전략 게임이라 캡처가 전혀 필요 없다 → 런치 캡처 자체를 끈다.
; (코드측 보강: AWCPlayerController::BeginPlay 의 FInputModeGameAndUI + ReleaseAllPointerCapture)
[/Script/Engine.InputSettings]
bCaptureMouseOnLaunch=False
