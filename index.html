<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="야생 마을" />
    <meta name="theme-color" content="#15202e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>1인칭 야생 마을</title>
    <script>
      // 일부 모바일 브라우저(삼성 인터넷 등)에서 100dvh 가 하단 툴바를 못 빼 화면 하단이 잘리는 문제 →
      // 실제 visible 높이(window.innerHeight)를 --app-height 로 박아 루트 높이로 사용(폴백 dvh).
      (function () {
        var d = document.documentElement;
        function setH() { d.style.setProperty("--app-height", window.innerHeight + "px"); }
        setH();
        window.addEventListener("resize", setH);
        window.addEventListener("orientationchange", setH);
      })();
    </script>
  </head>
  <body>
    <main id="app">
      <div id="game"></div>
    </main>
    <button id="pwa-install" type="button" hidden aria-label="앱 설치"
      style="position:fixed;top:calc(env(safe-area-inset-top, 0px) + 8px);left:50%;transform:translateX(-50%);z-index:9999;padding:8px 16px;border:0;border-radius:999px;background:#3f8f52;color:#fff;font:600 14px/1.2 system-ui,-apple-system,sans-serif;box-shadow:0 3px 10px rgba(0,0,0,.35);cursor:pointer;-webkit-tap-highlight-color:transparent;">📲 앱 설치</button>
    <script src="/studio-ident.js"></script>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // PWA — 서비스워커 등록(https 배포에서만, 로컬 dev/HMR 미간섭) + "앱 설치" 원탭 버튼.
      (function () {
        if ("serviceWorker" in navigator && location.protocol === "https:") {
          window.addEventListener("load", function () {
            navigator.serviceWorker.register(new URL("sw.js", document.baseURI)).catch(function () {});
          });
        }
        var btn = document.getElementById("pwa-install");
        if (!btn) return;
        var deferred = null;
        var ua = navigator.userAgent || "";
        var isIOS = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/.test(ua) && "ontouchend" in document);
        var isInApp = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|FB_IAB|Line\/|DaumApps|; wv\)/i.test(ua); // 카톡·네이버·인스타·페북·라인 등 인앱 브라우저
        var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
        // 브라우저에서 보는 중이면(=설치 전) 버튼을 항상 노출 — 프롬프트 이벤트가 안 떠도 안내를 받게.
        if (!standalone) btn.hidden = false;
        // 안드로이드/데스크톱 크롬 — 설치 가능 시 네이티브 프롬프트 확보.
        window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; if (!standalone) btn.hidden = false; });
        window.addEventListener("appinstalled", function () { btn.hidden = true; deferred = null; });
        btn.addEventListener("click", function () {
          if (deferred) { // 안드로이드 크롬: 바로 설치 창
            deferred.prompt();
            deferred.userChoice.finally(function () { deferred = null; btn.hidden = true; });
            return;
          }
          if (isInApp) { // 카톡·네이버 등 인앱 브라우저 → 설치 불가, 외부 브라우저로 열기
            alert("카톡·네이버 같은 앱 안에서는 설치가 안 돼요.\n\n오른쪽 위 ⋮(더보기) → '다른 브라우저로 열기'를 눌러\n크롬(안드로이드) 또는 사파리(아이폰)로 연 다음, 이 버튼을 다시 눌러주세요.");
            return;
          }
          if (isIOS) { // 아이폰은 사파리 공유 시트로만 설치
            alert("아이폰은 '사파리' 브라우저에서만 설치돼요.\n\n사파리 화면 아래(또는 위) 공유 버튼 ⬆️ 을 누른 뒤\n'홈 화면에 추가'를 선택하면 앱으로 설치됩니다.");
            return;
          }
          // 안드로이드/데스크톱인데 프롬프트가 아직 안 뜬 경우 폴백
          alert("브라우저 오른쪽 위 ⋮(더보기) 메뉴를 열고\n'앱 설치' 또는 '홈 화면에 추가'를 누르면 설치됩니다.");
        });
      })();
    </script>
  </body>
</html>
