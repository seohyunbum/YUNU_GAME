<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="야생 마을" />
    <meta name="theme-color" content="#15202e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>1인칭 야생 마을</title>
    <script>
      // 일부 모바일 브라우저(삼성 인터넷 등)에서 100dvh 가 하단 툴바를 못 빼 화면 하단이 잘리는 문제 →
      // 실제 visible 높이(window.innerHeight)를 --app-height 로 박아 루트 높이로 사용(폴백 dvh).
      (function () {
        var d = document.documentElement;
        function setH() { d.style.setProperty("--app-height", window.innerHeight + "px"); }
        setH();
        window.addEventListener("resize", setH);
        window.addEventListener("orientationchange", setH);
      })();
    </script>
  </head>
  <body>
    <main id="app">
      <div id="game"></div>
    </main>
    <script src="/studio-ident.js"></script>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // PWA — 홈 화면 설치 + 오프라인. https(배포)에서만 등록(로컬 dev/HMR 미간섭).
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register(new URL("sw.js", document.baseURI)).catch(function () {});
        });
      }
    </script>
  </body>
</html>
