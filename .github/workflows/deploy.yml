name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 하나의 배포만 동시 진행. 단, 진행 중 배포는 취소하지 않는다(취소 시 Pages 환경이
# 잠긴 채로 남아 다음 deploy-pages 가 즉시 실패함 — 실제로 100b7a7→d4dc93c 근접 push 에서 발생).
# GitHub 공식 Pages 템플릿 권장값과 동일: cancel-in-progress: false.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # deploy-pages 는 이전 배포 finalize 와 경합하면 몇 초 만에 일시 실패하는 일이 잦다
  # (2026-07-03~04 에만 4회, 매번 빌드는 성공·재시도 1회로 전부 해결). 외부 액션 의존 없이
  # 네이티브 continue-on-error + 조건부 재시도 1회로 자동 복구한다. 두 번 다 실패하면 job 실패(진짜 문제).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry (previous deployment finalize race)
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment_retry
        name: Retry deploy once
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
