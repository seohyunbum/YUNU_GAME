name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 하나의 배포만 동시 진행. 단, 진행 중 배포는 취소하지 않는다(취소 시 Pages 환경이
# 잠긴 채로 남아 다음 deploy-pages 가 즉시 실패함 — 실제로 100b7a7→d4dc93c 근접 push 에서 발생).
# GitHub 공식 Pages 템플릿 권장값과 동일: cancel-in-progress: false.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
